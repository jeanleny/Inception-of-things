apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: network
spec:
  rules:
    http:
      paths:
      - path: /wil
        pathType: Prefix
        backend:
          service:
            name: wil
            port:
              number: 8888
      - path: /gitlab
        pathType: Prefix
        backend:
          service:
            name: gitlab-svc
            port:
              number: 8088